<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kitchen — live orders</title>
  <!-- Inline emoji favicon so the browser stops 404-ing on /favicon.ico. -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍳</text></svg>">
  <link rel="stylesheet" href="style.css?v=a539ec9c">
  <!-- Light/dark toggle (default LIGHT); sets data-theme before paint to avoid a flash. -->
  <script src="/panels/theme.js?v=e909d1de"></script>
</head>
<body>
  <!-- Top bar: title, the live clock, sound toggle, and the 86 (sold-out) board. -->
  <header class="topbar">
    <div class="brand">🍳 Kitchen <span class="sub">live orders</span> <span id="restName" class="rest-name"></span></div>
    <div class="top-actions">
      <span id="clock" class="clock"></span>
      <button id="muteBtn" class="btn" title="New-order sound on/off">🔔</button>
      <button id="boardBtn" class="btn">🚫 86 board</button>
      <button id="viewBtn" class="btn viewtgl">▦ Wall view</button>
      <button id="reportIssueBtn" class="btn" title="Report an issue" aria-label="Report an issue">🚩</button>
      <button id="themeToggle" class="theme-toggle" type="button"></button>
    </div>
  </header>

  <!-- The three columns every kitchen thinks in: New → Cooking → Ready. -->
  <main class="cols" id="cols">
    <!-- Each list pre-renders two shimmer skeleton tickets so the board shows
         structure instantly on open; the first render() (app.js) overwrites them. -->
    <section class="col" id="col-new"><h2>🆕 New <span class="count" id="count-new"></span></h2><div class="tickets" id="list-new"><div class="skel-ticket"><div class="skel-line title"></div><div class="skel-line wide"></div><div class="skel-line short"></div></div><div class="skel-ticket"><div class="skel-line title"></div><div class="skel-line wide"></div></div></div></section>
    <section class="col" id="col-cooking"><h2>🔥 Cooking <span class="count" id="count-cooking"></span></h2><div class="tickets" id="list-cooking"><div class="skel-ticket"><div class="skel-line title"></div><div class="skel-line wide"></div><div class="skel-line short"></div></div></div></section>
    <section class="col" id="col-ready"><h2>✅ Ready <span class="count" id="count-ready"></span></h2><div class="tickets" id="list-ready"><div class="skel-ticket"><div class="skel-line title"></div><div class="skel-line short"></div></div></div></section>
  </main>

  <!-- WALL view (the "expansion"): EVERY live ticket in one dense grid, oldest first.
       Same tickets/actions as the columns; just laid out to see ~12-15 at once. -->
  <main class="wall" id="wall" hidden></main>

  <!-- The 86 board drawer: mark dishes sold-out / available without leaving the kitchen. -->
  <div class="drawer-overlay" id="drawerOverlay" hidden>
    <aside class="drawer">
      <div class="drawer-head"><h3>🚫 86 board <span class="sub">· mark dishes sold out</span></h3><button class="btn" id="drawerClose">✕</button></div>
      <input type="search" id="dishSearch" class="dish-search" placeholder="Find a dish…">
      <div id="dishList" class="dish-list"></div>
    </aside>
  </div>

  <div id="toasts" class="toasts"></div>
  <script src="/panels/maint.js?v=34e2db07"></script>
  <script src="/panels/realtime.js?v=078e53ce"></script>
  <!-- Offline action queue: saves writes on-device when offline, replays on reconnect. Load BEFORE app.js. -->
  <script src="/panels/outbox.js?v=f05cc89a"></script>
  <!-- Connection light (🟢 Live / 🟡 Reconnecting / 🔴 Offline) + "waiting to sync" list, top-right. AFTER realtime.js + outbox.js. -->
  <script src="/panels/connbadge.js?v=ace792b5"></script>
  <!-- OFFLINE LAYER: installs public/sw.js so this panel still OPENS and READS with no
       internet, then shows an honest "no internet / showing saved data / needs you" bar.
       offline.js must load AFTER outbox.js (it reads the queue) and after backstack.js
       is available for the back button. -->
  <script src="/panels/swreg.js?v=e799eb96"></script>
  <script src="/panels/offline.js?v=265a555d"></script>
  <script src="/panels/backstack.js?v=efe8afdb"></script>
  <!-- errlog: capture screen errors + batched tap breadcrumbs into the Everything Log. -->
  <script src="/panels/errlog.js?v=d74c7524"></script>
  <script src="/panels/issue-raise.js?v=99268ea5"></script>
  <!-- undobar: the shared "take it back" bar after a Ready mis-tap. -->
  <script src="/panels/undobar.js?v=9890d642"></script>
  <!-- fitnums: big figures shrink their font to FIT their tile instead of clipping. -->
  <script src="/panels/fitnums.js?v=84090f97" data-fit=".kot"></script>
  <script src="app.js?v=9856e3c6"></script>
</body>
</html>
