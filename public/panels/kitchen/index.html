<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kitchen — live orders</title>
  <!-- Inline emoji favicon so the browser stops 404-ing on /favicon.ico. -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍳</text></svg>">
  <link rel="stylesheet" href="style.css?v=c251c884">
  <!-- Light/dark toggle (default LIGHT); sets data-theme before paint to avoid a flash. -->
  <script src="/panels/theme.js?v=7aaf299f"></script>
</head>
<body>
  <!-- Top bar: title, the live clock, sound toggle, and the 86 (sold-out) board. -->
  <header class="topbar">
    <!-- ☰ MENU (owner, 2026-08-19: "kitchen will have whole separate menu for setup named setting,
         make 3 line thing so that kitchen user can logout and all that stuff too"). Same grammar as
         the waiter tablet's drawer — ☰ on the left, Settings inside it, Sign out inside Settings —
         because a cook and a waiter should not have to learn two different panels. It is also the
         kitchen's FIRST way to sign out: until now there was none anywhere on this screen. -->
    <button id="hamburger" class="hamburger" type="button" aria-label="Menu &amp; settings">☰</button>
    <div class="brand">🍳 Kitchen <span class="sub">live orders</span> <span id="restName" class="rest-name"></span></div>
    <div class="top-actions">
      <span id="clock" class="clock"></span>
      <button id="muteBtn" class="btn" title="New-order sound on/off">🔔</button>
      <!-- The two worded buttons keep their ICON always and drop their WORDS on a phone (the
           top bar was wrapping to four rows at 360px and eating ~230px of an 780px board —
           T4 sweep, 2026-08-04). title/aria-label carry the meaning either way. -->
      <button id="boardBtn" class="btn" title="Sold out list (the &quot;86 board&quot;) — mark dishes unavailable" aria-label="Sold out list"><i class="bi">🚫</i><i class="bw">Sold out</i></button>
      <button id="printerBtn" class="btn" title="Report a printer problem — the manager is told right away">🖨❗</button>
      <button id="viewBtn" class="btn viewtgl" title="Switch between the column board and the wall board"><i class="bi">▦</i><i class="bw" id="viewWord">Wall view</i></button>
      <button id="reportIssueBtn" class="btn" title="Report an issue" aria-label="Report an issue">🚩</button>
      <button id="themeToggle" class="theme-toggle" type="button"></button>
      <!-- ⋯ MORE — phone only (CSS hides it above 760px). On a phone app.js MOVES the three
           set-once-per-device controls (sound, board layout, theme) in here, so the bar keeps only
           what a cook touches during service. See the long note by buildMoreMenu() in app.js. -->
      <button id="moreBtn" class="btn kds-more-btn" type="button" title="Sound, board layout and theme" aria-label="More settings" aria-expanded="false">⋯</button>
    </div>
  </header>

  <!-- The three columns every kitchen thinks in: New → Cooking → Ready. -->
  <main class="cols" id="cols">
    <!-- Each list pre-renders two shimmer skeleton tickets so the board shows
         structure instantly on open; the first render() (app.js) overwrites them. -->
    <section class="col" id="col-new"><h2>🆕 New <span class="count" id="count-new"></span></h2><div class="tickets" id="list-new"><div class="skel-ticket"><div class="skel-line title"></div><div class="skel-line wide"></div><div class="skel-line short"></div></div><div class="skel-ticket"><div class="skel-line title"></div><div class="skel-line wide"></div></div></div></section>
    <section class="col" id="col-cooking"><h2>🔥 Cooking <span class="count" id="count-cooking"></span></h2><div class="tickets" id="list-cooking"><div class="skel-ticket"><div class="skel-line title"></div><div class="skel-line wide"></div><div class="skel-line short"></div></div></div></section>
    <section class="col" id="col-ready"><h2>✅ Ready <span class="count" id="count-ready"></span></h2><div class="tickets" id="list-ready"><div class="skel-ticket"><div class="skel-line title"></div><div class="skel-line short"></div></div></div></section>
  </main>

  <!-- WALL view (the "expansion"): EVERY live ticket in one dense grid, oldest first.
       Same tickets/actions as the columns; just laid out to see ~12-15 at once. -->
  <main class="wall" id="wall" hidden></main>

  <!-- The 86 board drawer: mark dishes sold-out / available without leaving the kitchen. -->
  <div class="drawer-overlay" id="drawerOverlay" hidden>
    <aside class="drawer">
      <div class="drawer-head"><h3>🚫 Sold out <span class="sub">· mark dishes unavailable (the “86 board”)</span></h3><button class="btn" id="drawerClose">✕</button></div>
      <input type="search" id="dishSearch" class="dish-search" placeholder="Find a dish…">
      <div id="dishList" class="dish-list"></div>
    </aside>
  </div>

  <div id="toasts" class="toasts"></div>
  <script src="/panels/maint.js?v=293989ce"></script>
  <script src="/panels/realtime.js?v=122c17eb"></script>
  <!-- Offline action queue: saves writes on-device when offline, replays on reconnect. Load BEFORE app.js. -->
  <script src="/panels/outbox.js?v=79344a64"></script>
  <!-- Connection light (🟢 Live / 🟡 Reconnecting / 🔴 Offline) + "waiting to sync" list, top-right. AFTER realtime.js + outbox.js. -->
  <script src="/panels/connbadge.js?v=50328560"></script>
  <!-- OFFLINE LAYER: installs public/sw.js so this panel still OPENS and READS with no
       internet, then shows an honest "no internet / showing saved data / needs you" bar.
       offline.js must load AFTER outbox.js (it reads the queue) and BEFORE app.js.
       It does NOT need backstack.js loaded first, which is why backstack.js sits just below:
       offline.js only reaches for LFH_BACK lazily, inside its "needs you" sheet, and it boots on
       DOMContentLoaded — by which time every tag here has run. (The old wording claimed the
       opposite of the actual order in this file and would have sent the next person reordering
       these tags the wrong way. T4 sweep, 2026-08-11.) -->
  <script src="/panels/swreg.js?v=0d429b78"></script>
  <script src="/panels/offline.js?v=9e03ae1a"></script>
  <script src="/panels/backstack.js?v=efe8afdb"></script>
  <!-- errlog: capture screen errors + batched tap breadcrumbs into the Everything Log. -->
  <script src="/panels/errlog.js?v=81a35c3c"></script>
  <script src="/panels/issue-raise.js?v=2a56fffc"></script>
  <!-- undobar: the shared "take it back" bar after a Ready mis-tap. -->
  <script src="/panels/undobar.js?v=e5a33483"></script>
  <!-- fitnums: big figures shrink their font to FIT their tile instead of clipping. -->
  <script src="/panels/fitnums.js?v=49e195eb" data-fit=".kot"></script>
  <!-- billdoc: THE kitchen ticket, written down once (LFH_BILLDOC) and shared with the manager
       panel and the admin's sample, so a ticket can never look different in two places. -->
  <script src="/panels/billdoc.js?v=3f068689"></script>
  <script src="app.js?v=65099990"></script>
</body>
</html>
