<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Manager — Aevidine</title>
  <!-- Inline emoji favicon (an SVG data URI) so the browser stops 404-ing on /favicon.ico — no extra file needed. -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍽️</text></svg>" />
  <!-- Font Awesome is SELF-HOSTED (was a cdnjs link) so the panel's icons never break
       when an external CDN is slow/down — same reliability rule the guest menu follows
       (it self-hosts supabase-js). Files live in /panels/vendor/fa/. -->
  <link rel="stylesheet" href="/panels/vendor/fa/css/all.min.css?v=b6e55516" />
  <!-- ?v= cache-bust: without it the browser keeps a STALE stylesheet across deploys
       (the exact /manager stale-app.js gotcha) — bump it whenever style.css changes. -->
  <link rel="stylesheet" href="/panels/editor/style.css?v=dc335568" />
  <!-- the "who is this bill for?" box — shared with the other panel that opens it -->
  <link rel="stylesheet" href="/panels/billcustomer.css?v=23b15d10" />
  <!-- Light/dark toggle (default LIGHT); sets data-theme before paint to avoid a flash. -->
  <script src="/panels/theme.js?v=7aaf299f"></script>
</head>
<body>
  <header class="topbar">
    <!-- Phone-only (≤760px) hamburger: opens the .tabs nav as a left slide-in drawer.
         Hidden on desktop, where the tabs sit in the bar as always. Wired in app.js. -->
    <button id="navBurger" class="nav-burger" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="mainTabs">
      <span></span><span></span><span></span>
    </button>
    <!-- No emoji in front of "Manager" (owner, 2026-09-03: "can remove the emoji from manager
         front"). It was decoration on the one bar that has to hold the brand, the restaurant, the
         connection and the bell on a single phone row — and this project's own style rule says an
         emoji is not an icon. The word alone is the panel's name. -->
    <div class="brand">Manager<span class="brand-rest" id="brandRest"></span></div>
    <!-- Dimmed backdrop behind the phone drawer; tap to close. Lives INSIDE the topbar so
         it shares the topbar's stacking context and can't cover the drawer itself. -->
    <div id="navScrim" class="nav-scrim"></div>
    <nav class="tabs" id="mainTabs">
      <!-- Drawer-only header row (hidden on desktop): title + ✕ close. Not a .tab, so
           app.js's querySelectorAll(".tab") loops ignore it. -->
      <div class="tabs-head"><span>Sections</span><button id="navClose" type="button" aria-label="Close menu">✕</button></div>
      <!-- DESKTOP RAIL ONLY: collapse to icons / expand to full names. Hidden on phone, where
           the same nav is already a full-width drawer with labels. -->
      <!-- THE PANEL ALWAYS OPENS ON THE FLOOR, so the floor is the row that ships marked
           active (T8 sweep #8, 2026-09-03). app.js pins `tab: "tables"` for the real panel,
           for the owner console's Manager mode and for the layout preview — "the floor is what
           they need on arrival, every time" — and then setTab() moves the highlight. This markup
           shipped the highlight on Editor, so between first paint and app.js finishing (it is
           over a megabyte) the wrong section was lit and then jumped. The two single-purpose
           embeds (menuonly / invonly) open on their own tab and setTab corrects them either way. -->
      <button class="tab" data-tab="items" title="Editor"><i class="tab-ico" aria-hidden="true">📝</i><span class="tab-lbl">Editor</span></button>
      <button class="tab" data-tab="orders" title="Bills"><i class="tab-ico" aria-hidden="true">🧾</i><span class="tab-lbl">Bills</span><span id="ordersBadge" class="tab-badge" hidden></span></button>
      <button class="tab active" data-tab="tables" title="Tables"><i class="tab-ico" aria-hidden="true">🪑</i><span class="tab-lbl">Tables</span><span id="tablesBadge" class="tab-badge" hidden></span></button>
      <button class="tab" data-tab="platform" title="Platform"><i class="tab-ico" aria-hidden="true">🛵</i><span class="tab-lbl">Platform</span><span id="platformBadge" class="tab-badge" hidden></span></button>
      <!-- Banquet module (mig 130): admin-entitled per restaurant — unhidden by syncBanquetTab() only when settings.banquet_allowed. -->
      <button class="tab" data-tab="banquet" hidden title="Banquet"><i class="tab-ico" aria-hidden="true">🎪</i><span class="tab-lbl">Banquet</span></button>
      <!-- Inventory module (mig 221): admin-entitled per restaurant — unhidden by syncInventoryTab(). -->
      <button class="tab" data-tab="inventory" hidden title="Inventory"><i class="tab-ico" aria-hidden="true">📦</i><span class="tab-lbl">Inventory</span></button>
      <!-- Every drawer row carries a glyph: on a phone the icon is the fastest thing to aim at,
           and Dashboard + Settings were the only two bare-text rows in the list, which read as
           half-finished beside the other seven (T12 phone sweep, 2026-08-05). -->
      <button class="tab" data-tab="dash" title="Dashboard"><i class="tab-ico" aria-hidden="true">📊</i><span class="tab-lbl">Dashboard</span></button>
      <!-- Guest ratings (mig 140): gated by the view_ratings manager power via XRAY_TABS. -->
      <!-- "Rating review", not "Ratings" (owner, 2026-08-02) — the Access screen row says the
           same. Only the LABEL changed: the tab key, the stored menus key and the view_ratings
           grant all keep their names (renaming a label must never rename a key). -->
      <button class="tab" data-tab="ratings" title="Rating review"><i class="tab-ico" aria-hidden="true">⭐</i><span class="tab-lbl">Rating review</span></button>
      <!-- "Audit & logs", not "Audit" (owner, 2026-08-02) — one tab holding the removals
           record, the activity log and the customer log. Only the LABEL changed: the tab
           key, the stored menus key and the view_logs grant all keep their names. -->
      <button class="tab" data-tab="log" title="Audit &amp; logs"><i class="tab-ico" aria-hidden="true">🗂</i><span class="tab-lbl">Audit &amp; logs</span></button>
      
      <button class="tab" data-tab="general" title="Settings"><i class="tab-ico" aria-hidden="true">⚙️</i><span class="tab-lbl">Settings</span></button>
      <!-- SHIPPED IN THE COLLAPSED STATE, and every part of the row has to agree with that
           (T8 sweep #8, 2026-09-03). The rail starts collapsed (app.js RAIL_KEY defaults off), and
           app.js's syncNavRail() words a collapsed row "Keep open" / » / aria "Expand menu". This
           markup shipped the EXPANDED word "Collapse" beside the collapsed aria-label, so until
           app.js finished downloading — a megabyte, on a restaurant's wifi — the one button whose
           job is to open the rail read "Collapse". That is the exact fault app.js's own note says
           it fixed; the fix never reached the shipped markup. -->
      <button id="railToggle" class="rail-toggle" type="button" aria-label="Expand menu" aria-expanded="false" title="Expand menu"><i class="tab-ico" aria-hidden="true">»</i><span class="tab-lbl">Keep open</span></button>
    </nav>
    <!-- Right-side actions cluster. The shared connbadge.js mounts the 🟢/🟡/🔴 connection
         light as the FIRST child of .top-actions (kitchen/tablet have this wrapper too); without
         it the pill was inserted at the far LEFT of the topbar, before the brand. That pill is
         now the ONLY connection indicator this panel has — see the obituary below. -->
    <div class="top-actions">
      <button id="themeToggle" class="theme-toggle" type="button"></button>
      <button id="reportIssueBtn" class="theme-toggle" type="button" title="Report an issue to the owner" aria-label="Report an issue">🚩</button>
      <!-- My profile & pay (mig 220). Starts hidden; myprofile.js reveals it only when this
           restaurant has the feature and this person has a profile. -->
      <!-- 💳, not 👤: this opens "my profile & PAY", while maint.js's neighbouring button (the
           staff drawer: name, phone, PIN, panel password) is the 👤 one. Once the phone layout
           dropped the word "Profile" from that neighbour to make the row fit, two IDENTICAL person
           glyphs sat side by side and neither said which was which (T12 phone sweep, 2026-08-05).
           Same crowding the tablet panel solved by suppressing one; here both are reachable, so
           they just need to look different. -->
      <button id="myProfileBtn" class="theme-toggle" type="button" title="My profile &amp; pay" aria-label="My profile and pay" hidden style="display:none">💳</button>
      <!-- OBITUARY: `<div class="conn" id="conn">connecting…</div>` lived here until 2026-09-03.
           It was this panel's ORIGINAL connection indicator — a line of text that said
           "connecting…", then "connected" / "offline" / "connection failed". connbadge.js's
           🟢/🟡/🔴 pill replaced it, and the manager panel was the only one of the three that
           never had the old one removed: the new pill carried code to HIDE it on sight, and
           editor/app.js went on writing three different words into a hidden element in four
           places. Two things doing one job, one of them invisible — the owner's standing rule
           (2026-08-29) is that the new way REPLACES the old one. The kitchen and waiter shells
           never shipped it. Removed here together with app.js's four writes, connbadge.js's
           hide-the-legacy branch and style.css's four `.conn` rules — the whole path, in one
           change, because deleting only the markup would make those four writes throw. -->
    </div>
  </header>

  <main class="layout">
    <aside class="sidebar">
      <!-- Sub-nav for the "Editor" section: Dishes / Categories / Tags. Shown only
           while one of those is open (toggled by setTab in app.js). -->
      <div class="subtabs" id="editorSubtabs" hidden>
        <button class="subtab active" data-tab="items">Dishes</button>
        <button class="subtab" data-tab="categories">Categories</button>
        <button class="subtab" data-tab="filters">Tags</button>
      </div>
      <div class="sidebar-head">
        <input id="search" class="search" type="search" placeholder="Search…" />
        <!-- Dishes tab only: enter multi-select to mark many dishes sold-out/available or delete. -->
        <button id="bulkBtn" class="btn" type="button" hidden title="Select several dishes at once">☑︎ Select</button>
        <button id="newBtn" class="btn primary">+ New</button>
        <!-- Live suggestions dropdown: top matches as you type; click to open in the
             editor. Built by renderSearchSuggest() in app.js. -->
        <div id="searchSuggest" class="search-suggest" role="listbox" hidden></div>
      </div>
      <!-- Category filter chips (Dishes tab only): tap a category to see just its
           dishes. Built by renderCatFilter() in app.js; hidden on other tabs. -->
      <div id="catFilter" class="cat-filter" hidden></div>
      <!-- Skeleton rows show INSTANTLY on open and are replaced by the first renderList()
           (app.js writes list.innerHTML, which clears them). Without these the sidebar was a
           blank white column until /all came back — the same "half-built screen" the admin
           panel's unstyled flash was. Styled from style.css, which is a real <link>, so the
           placeholder itself can never appear unstyled. -->
      <ul id="list" class="list">
        <li class="list-item lrow-skel"><span class="sk-thumb"></span><span class="sk-txt"><span class="sk-line"></span><span class="sk-line sub"></span></span></li>
        <li class="list-item lrow-skel"><span class="sk-thumb"></span><span class="sk-txt"><span class="sk-line"></span><span class="sk-line sub"></span></span></li>
        <li class="list-item lrow-skel"><span class="sk-thumb"></span><span class="sk-txt"><span class="sk-line"></span><span class="sk-line sub"></span></span></li>
        <li class="list-item lrow-skel"><span class="sk-thumb"></span><span class="sk-txt"><span class="sk-line"></span><span class="sk-line sub"></span></span></li>
        <li class="list-item lrow-skel"><span class="sk-thumb"></span><span class="sk-txt"><span class="sk-line"></span><span class="sk-line sub"></span></span></li>
        <li class="list-item lrow-skel"><span class="sk-thumb"></span><span class="sk-txt"><span class="sk-line"></span><span class="sk-line sub"></span></span></li>
      </ul>
      <div class="sidebar-resizer" id="sidebarResizer" title="Drag to resize"></div>
    </aside>

    <section class="editor" id="editor">
      <div class="empty">Pick something on the left, or hit <b>+ New</b>.</div>
    </section>
  </main>

  <div id="toast" class="toast" hidden></div>
  <!-- Chart.js powers the Dashboard graphs. SELF-HOSTED (was a jsdelivr CDN link) so the
       Dashboard still draws when an external CDN hiccups. File in /panels/vendor/. -->
  <script src="/panels/vendor/chart.umd.min.js?v=9db14121"></script>
  <!-- maint.js: the shared staff drawer (name, phone, PIN, panel password), the panel's own
       yes/no + reason cards (LFH_ASK, used by inventory.js), and the write deadline. -->
  <script src="/panels/maint.js?v=293989ce"></script>
  <!-- realtime.js: the ONE live-update channel every panel shares (LFH_RT). Must load before
       outbox.js, connbadge.js, offline.js and errlog.js, which all reach for it. -->
  <script src="/panels/realtime.js?v=122c17eb"></script>
  <!-- Offline action queue: saves writes on-device when offline, replays on reconnect. Load BEFORE app.js. -->
  <script src="/panels/outbox.js?v=79344a64"></script>
  <!-- Connection light (🟢 Live / 🟡 Reconnecting / 🔴 Offline) + "waiting to sync" list, top-right. AFTER realtime.js + outbox.js. -->
  <script src="/panels/connbadge.js?v=50328560"></script>
  <!-- OFFLINE LAYER: installs public/sw.js so this panel still OPENS and READS with no
       internet, then shows an honest "no internet / showing saved data / needs you" bar.
       offline.js must load AFTER outbox.js (it reads the queue) and before app.js. -->
  <script src="/panels/swreg.js?v=0d429b78"></script>
  <script src="/panels/offline.js?v=9e03ae1a"></script>
  <!-- What the GUEST MENU is waiting for (owner, 2026-08-13): the 🔔 in the top bar + its sheet.
       Reads NOTHING of its own — the panel hands it rows off the board it already has — and it
       renders nothing at all when the guest menu is switched off for the restaurant.
       IT LOADS BEFORE backstack.js, and that is fine — this note used to claim the opposite
       (T8 sweep #8, 2026-09-03). The sheet asks for its back layer when it OPENS, guarded
       (`window.LFH_BACK && window.LFH_BACK.layer`), never at parse time, so backstack.js has
       been loaded for a long while by then. The waiter tablet loads the pair in this same
       order. A note that states a rule the file does not follow is how the next reader
       "fixes" a working order. -->
  <script src="/panels/guestbell.js?v=aa4653da"></script>
  <!-- Hardware BACK button: peels the top open modal instead of leaving the panel
       (the guest app + kitchen/tablet already load this; the manager panel didn't,
       so phone Back exited mid-action — fixed 2026-07-06). Must load BEFORE app.js. -->
  <script src="/panels/backstack.js?v=efe8afdb"></script>
  <!-- Hand-written per-restaurant floor plans, read only when a restaurant's layout mode is
       Custom (mig 238). Pure data; loads before app.js so the first floor render can see it. -->
  <script src="/panels/floor-layouts.js?v=f764ed73"></script>
  <!-- errlog: capture screen errors + batched tap breadcrumbs into the Everything Log. -->
  <script src="/panels/errlog.js?v=81a35c3c"></script>
  <!-- Shared "Report an issue" widget (subject + photo + live voice note). Must load
       BEFORE app.js so openIssueModal() can call it. -->
  <script src="/panels/issue-raise.js?v=2a56fffc"></script>
  <!-- My profile & pay (mig 220) — shared with the waiter tablet -->
  <script src="/panels/myprofile.js?v=e194a3d8"></script>
  <!-- "there is more this way" on any row that scrolls sideways (T12, 2026-08-13): a soft edge
       fade plus a "-> N more" chip, driven by measurement. Marked rows carry data-swipe-hint. -->
  <script src="/panels/swipehint.js?v=da7e0a29"></script>
  <!-- undobar: the shared "take it back" bar after a Serve/Settle mis-tap. -->
  <script src="/panels/undobar.js?v=e5a33483"></script>
  <!-- "who is this bill for?" sheet — phone-first customer capture (shared with the tablet) -->
  <script src="/panels/billcustomer.js?v=53a15e30"></script>
  <!-- fitnums: big figures shrink their font to FIT their tile instead of clipping.
       `.bill-amt` was REMOVED from this list on 2026-09-03 (T8 sweep #8). It was the Bills tab's
       bill-amount class until the 2026-08-03 Bills rebuild renamed it `.bl-amt`, and the list was
       never updated — so for a month this selector matched nothing at all. It is deleted rather
       than re-pointed, and that is the deliberate half: measured on a 360px phone with the row as
       it is built today, a total of ₹12,34,567.89 beside a "₹6,00,000 in · ₹6,34,567.89 left"
       sub-line overflows its box by ZERO pixels, because `.bl-mid` carries `min-width:0` and gives
       way first. There is nothing for the helper to do there, and a bill figure is the one number
       fitnums.js says in capitals must never end up in a net that can abbreviate it. If the row is
       ever redesigned so the amount can clip, add `.bl-amt` here AND to EXACT_SEL in fitnums.js —
       both, in the same change.
       `:not(.ktext)` also went on 2026-09-03. A dashboard tile whose value was WORDS rather than a
       figure used to be rendered `<b class="ktext">` (commit 9d9d8be3) and excluded here, because
       shrinking a sentence to fit is not the same as shrinking a number. That branch left the
       renderer long ago — `dashCard()` now writes a bare `<b>` — so the exclusion had nothing to
       exclude, and `.dash-card b.ktext` in style.css had nothing to style. If a word-valued tile
       comes back, the class goes back on the element AND back in this list, together. -->
  <script src="/panels/fitnums.js?v=49e195eb" data-fit=".dash-card .kbody b,.tbox-n,.fstat-n,.ks-val,.ord-total span:last-child"></script>
  <!-- Inventory tab (mig 221) — owns the 📦 tab; app.js delegates via LFH_INV. Load BEFORE app.js. -->
  <script src="/panels/editor/inventory.js?v=aabfc336"></script>
  <!-- billdoc: THE bill and THE kitchen ticket, written down once (LFH_BILLDOC) and shared with
       the kitchen panel and the admin's sample, so a document can never look different in two
       places. app.js CALLS LFH_BILLDOC (billIdentity, splitTax), so this must load BEFORE it —
       without it, printing a bill throws "LFH_BILLDOC is not defined" and nothing prints. -->
  <script src="/panels/billdoc.js?v=d782d9c2"></script>
  <!-- auditsort: the plain-English words and the sort order for Audit & logs, shared with the
       owner console's Audit screen so the same event can never be worded two ways. -->
  <script src="/panels/auditsort.js?v=1da861b5"></script>
  <!-- ?v= on app.js too: the /manager iframe otherwise keeps a STALE cached app.js
       across deploys (the original gotcha) — bump whenever app.js changes. -->
  <script src="/panels/editor/app.js?v=f8b44e57"></script>
</body>
</html>
