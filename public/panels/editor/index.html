<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Manager — Little French House</title>
  <!-- Inline emoji favicon (an SVG data URI) so the browser stops 404-ing on /favicon.ico — no extra file needed. -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍽️</text></svg>" />
  <!-- Font Awesome is SELF-HOSTED (was a cdnjs link) so the panel's icons never break
       when an external CDN is slow/down — same reliability rule the guest menu follows
       (it self-hosts supabase-js). Files live in /panels/vendor/fa/. -->
  <link rel="stylesheet" href="/panels/vendor/fa/css/all.min.css?v=6.5.1" />
  <!-- ?v= cache-bust: without it the browser keeps a STALE stylesheet across deploys
       (the exact /manager stale-app.js gotcha) — bump it whenever style.css changes. -->
  <link rel="stylesheet" href="/panels/editor/style.css?v=aba78f11" />
  <!-- Light/dark toggle (default LIGHT); sets data-theme before paint to avoid a flash. -->
  <script src="/panels/theme.js?v=e909d1de"></script>
</head>
<body>
  <header class="topbar">
    <!-- Phone-only (≤760px) hamburger: opens the .tabs nav as a left slide-in drawer.
         Hidden on desktop, where the tabs sit in the bar as always. Wired in app.js. -->
    <button id="navBurger" class="nav-burger" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="mainTabs">
      <span></span><span></span><span></span>
    </button>
    <div class="brand"><span>🍽️</span> Manager<span class="brand-rest" id="brandRest"></span></div>
    <!-- Dimmed backdrop behind the phone drawer; tap to close. Lives INSIDE the topbar so
         it shares the topbar's stacking context and can't cover the drawer itself. -->
    <div id="navScrim" class="nav-scrim"></div>
    <nav class="tabs" id="mainTabs">
      <!-- Drawer-only header row (hidden on desktop): title + ✕ close. Not a .tab, so
           app.js's querySelectorAll(".tab") loops ignore it. -->
      <div class="tabs-head"><span>Sections</span><button id="navClose" type="button" aria-label="Close menu">✕</button></div>
      <button class="tab active" data-tab="items">📝 Editor</button>
      <button class="tab" data-tab="orders">🧾 Bills<span id="ordersBadge" class="tab-badge" hidden></span></button>
      <button class="tab" data-tab="tables">Tables<span id="tablesBadge" class="tab-badge" hidden></span></button>
      <button class="tab" data-tab="platform">🛵 Platform<span id="platformBadge" class="tab-badge" hidden></span></button>
      <!-- Banquet module (mig 130): admin-entitled per restaurant — unhidden by syncBanquetTab() only when settings.banquet_allowed. -->
      <button class="tab" data-tab="banquet" hidden>🎪 Banquet</button>
      <!-- Inventory module (mig 221): admin-entitled per restaurant — unhidden by syncInventoryTab(). -->
      <button class="tab" data-tab="inventory" hidden>📦 Inventory</button>
      <button class="tab" data-tab="dash">Dashboard</button>
      <!-- Guest ratings (mig 140): gated by the view_ratings manager power via XRAY_TABS. -->
      <!-- "Rating review", not "Ratings" (owner, 2026-08-02) — the Access screen row says the
           same. Only the LABEL changed: the tab key, the stored menus key and the view_ratings
           grant all keep their names (renaming a label must never rename a key). -->
      <button class="tab" data-tab="ratings">⭐ Rating review</button>
      <!-- "Audit & logs", not "Audit" (owner, 2026-08-02) — one tab holding the removals
           record, the activity log and the customer log. Only the LABEL changed: the tab
           key, the stored menus key and the view_logs grant all keep their names. -->
      <button class="tab" data-tab="log">🗂 Audit &amp; logs</button>
      
      <button class="tab" data-tab="general">Settings</button>
    </nav>
    <!-- Right-side actions cluster. The shared connbadge.js mounts the 🟢/🟡/🔴 connection
         light as the FIRST child of .top-actions (kitchen/tablet have this wrapper too); without
         it the pill was inserted at the far LEFT of the topbar, before the brand. -->
    <div class="top-actions">
      <button id="themeToggle" class="theme-toggle" type="button"></button>
      <button id="reportIssueBtn" class="theme-toggle" type="button" title="Report an issue to the owner" aria-label="Report an issue">🚩</button>
      <!-- My profile & pay (mig 220). Starts hidden; myprofile.js reveals it only when this
           restaurant has the feature and this person has a profile. -->
      <button id="myProfileBtn" class="theme-toggle" type="button" title="My profile &amp; pay" aria-label="My profile and pay" hidden style="display:none">👤</button>
      <div class="conn" id="conn">connecting…</div>
    </div>
  </header>

  <main class="layout">
    <aside class="sidebar">
      <!-- Sub-nav for the "Editor" section: Dishes / Categories / Tags. Shown only
           while one of those is open (toggled by setTab in app.js). -->
      <div class="subtabs" id="editorSubtabs" hidden>
        <button class="subtab active" data-tab="items">Dishes</button>
        <button class="subtab" data-tab="categories">Categories</button>
        <button class="subtab" data-tab="filters">Tags</button>
      </div>
      <div class="sidebar-head">
        <input id="search" class="search" type="search" placeholder="Search…" />
        <!-- Dishes tab only: enter multi-select to mark many dishes sold-out/available or delete. -->
        <button id="bulkBtn" class="btn" type="button" hidden title="Select several dishes at once">☑︎ Select</button>
        <button id="newBtn" class="btn primary">+ New</button>
        <!-- Live suggestions dropdown: top matches as you type; click to open in the
             editor. Built by renderSearchSuggest() in app.js. -->
        <div id="searchSuggest" class="search-suggest" role="listbox" hidden></div>
      </div>
      <!-- Category filter chips (Dishes tab only): tap a category to see just its
           dishes. Built by renderCatFilter() in app.js; hidden on other tabs. -->
      <div id="catFilter" class="cat-filter" hidden></div>
      <!-- Skeleton rows show INSTANTLY on open and are replaced by the first renderList()
           (app.js writes list.innerHTML, which clears them). Without these the sidebar was a
           blank white column until /all came back — the same "half-built screen" the admin
           panel's unstyled flash was. Styled from style.css, which is a real <link>, so the
           placeholder itself can never appear unstyled. -->
      <ul id="list" class="list">
        <li class="list-item lrow-skel"><span class="sk-thumb"></span><span class="sk-txt"><span class="sk-line"></span><span class="sk-line sub"></span></span></li>
        <li class="list-item lrow-skel"><span class="sk-thumb"></span><span class="sk-txt"><span class="sk-line"></span><span class="sk-line sub"></span></span></li>
        <li class="list-item lrow-skel"><span class="sk-thumb"></span><span class="sk-txt"><span class="sk-line"></span><span class="sk-line sub"></span></span></li>
        <li class="list-item lrow-skel"><span class="sk-thumb"></span><span class="sk-txt"><span class="sk-line"></span><span class="sk-line sub"></span></span></li>
        <li class="list-item lrow-skel"><span class="sk-thumb"></span><span class="sk-txt"><span class="sk-line"></span><span class="sk-line sub"></span></span></li>
        <li class="list-item lrow-skel"><span class="sk-thumb"></span><span class="sk-txt"><span class="sk-line"></span><span class="sk-line sub"></span></span></li>
      </ul>
      <div class="sidebar-resizer" id="sidebarResizer" title="Drag to resize"></div>
    </aside>

    <section class="editor" id="editor">
      <div class="empty">Pick something on the left, or hit <b>+ New</b>.</div>
    </section>
  </main>

  <div id="toast" class="toast" hidden></div>
  <!-- Chart.js powers the Dashboard graphs. SELF-HOSTED (was a jsdelivr CDN link) so the
       Dashboard still draws when an external CDN hiccups. File in /panels/vendor/. -->
  <script src="/panels/vendor/chart.umd.min.js?v=4.4.7"></script>
  <script src="/panels/maint.js?v=d6f9ad32"></script>
  <script src="/panels/realtime.js?v=1a3eee11"></script>
  <!-- Offline action queue: saves writes on-device when offline, replays on reconnect. Load BEFORE app.js. -->
  <script src="/panels/outbox.js?v=ad497f62"></script>
  <!-- Connection light (🟢 Live / 🟡 Reconnecting / 🔴 Offline) + "waiting to sync" list, top-right. AFTER realtime.js + outbox.js. -->
  <script src="/panels/connbadge.js?v=ace792b5"></script>
  <!-- OFFLINE LAYER: installs public/sw.js so this panel still OPENS and READS with no
       internet, then shows an honest "no internet / showing saved data / needs you" bar.
       offline.js must load AFTER outbox.js (it reads the queue) and before app.js. -->
  <script src="/panels/swreg.js?v=e799eb96"></script>
  <script src="/panels/offline.js?v=c4f73723"></script>
  <!-- Hardware BACK button: peels the top open modal instead of leaving the panel
       (the guest app + kitchen/tablet already load this; the manager panel didn't,
       so phone Back exited mid-action — fixed 2026-07-06). Must load BEFORE app.js. -->
  <script src="/panels/backstack.js?v=efe8afdb"></script>
  <!-- Hand-written per-restaurant floor plans, read only when a restaurant's layout mode is
       Custom (mig 238). Pure data; loads before app.js so the first floor render can see it. -->
  <script src="/panels/floor-layouts.js?v=2ec8b2f2"></script>
  <!-- errlog: capture screen errors + batched tap breadcrumbs into the Everything Log. -->
  <script src="/panels/errlog.js?v=d74c7524"></script>
  <!-- Shared "Report an issue" widget (subject + photo + live voice note). Must load
       BEFORE app.js so openIssueModal() can call it. -->
  <script src="/panels/issue-raise.js?v=99268ea5"></script>
  <!-- My profile & pay (mig 220) — shared with the waiter tablet -->
  <script src="/panels/myprofile.js?v=0bc664c0"></script>
  <!-- undobar: the shared "take it back" bar after a Serve/Settle mis-tap. -->
  <script src="/panels/undobar.js?v=9890d642"></script>
  <!-- "who is this bill for?" sheet — phone-first customer capture (shared with the tablet) -->
  <script src="/panels/billcustomer.js?v=d165b9d0"></script>
  <!-- fitnums: big figures shrink their font to FIT their tile instead of clipping. -->
  <script src="/panels/fitnums.js?v=84090f97" data-fit=".dash-card .kbody b:not(.ktext),.tbox-n,.fstat-n,.bill-amt,.ks-val,.ord-total span:last-child"></script>
  <!-- Inventory tab (mig 221) — owns the 📦 tab; app.js delegates via LFH_INV. Load BEFORE app.js. -->
  <script src="/panels/editor/inventory.js?v=424421e3"></script>
  <!-- billdoc: THE bill and THE kitchen ticket, written down once (LFH_BILLDOC) and shared with
       the kitchen panel and the admin's sample, so a document can never look different in two
       places. app.js CALLS LFH_BILLDOC (billIdentity, splitTax), so this must load BEFORE it —
       without it, printing a bill throws "LFH_BILLDOC is not defined" and nothing prints. -->
  <script src="/panels/billdoc.js?v=398f1baa"></script>
  <!-- ?v= on app.js too: the /manager iframe otherwise keeps a STALE cached app.js
       across deploys (the original gotcha) — bump whenever app.js changes. -->
  <script src="/panels/editor/app.js?v=06ca3f69"></script>
</body>
</html>
