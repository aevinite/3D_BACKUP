<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Waiter tablet</title>
  <!-- Inline emoji favicon so the browser stops 404-ing on /favicon.ico. -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧑‍🍳</text></svg>">
  <link rel="stylesheet" href="style.css?v=fd90cb7a">
  <!-- Light/dark toggle (default LIGHT); sets data-theme before paint to avoid a flash. -->
  <script src="/panels/theme.js?v=e909d1de"></script>
</head>
<body>
  <!-- MINIMAL top bar (owner, 2026-08-03 — "minimize the top so the tables get the screen"):
       ☰ on the left (menu → Settings → Log out), a small brand, and ONE always-there action —
       ⚡ Quick order (build the order first, pick the table at the END). The live count chips
       and the clock left this bar on purpose: the owner does not want live counters up here,
       and the clock still lives in the ☰ drawer. connbadge.js mounts the 🟢/🟡/🔴 light as the
       FIRST child of .top-actions, same as every panel. -->
  <header class="topbar">
    <button id="hamburger" class="hamburger" type="button" aria-label="Menu &amp; settings">☰</button>
    <!-- The RESTAURANT's name is the part that must survive a narrow screen (no tenant may
         wear another's branding), so the generic word is what drops on a phone — not the name. -->
    <div class="brand"><span class="brand-word">🧑‍🍳 Tables</span> <span id="restName" class="rest-name"></span></div>
    <!-- The words drop on a narrow phone (CSS), leaving the ⚡ — the restaurant's own name needs
         that room more than the label does, and the button keeps its title/aria-label. -->
    <div class="top-actions"><button id="quickOrderBtn" class="qo-top" type="button" title="Quick order — build it first, choose the table last" aria-label="Quick order" hidden style="display:none"><i class="qo-bolt">⚡</i><i class="qo-word">Quick order</i></button><button id="reportIssueBtn" class="theme-toggle" type="button" title="Report an issue" aria-label="Report an issue">🚩</button><button id="themeToggle" class="theme-toggle" type="button"></button></div>
  </header>

  <main class="layout">
    <!-- LEFT: the live floor — one tile per table, tap to work that table. -->
    <section class="floor">
      <div class="floor-nav" id="floorNav"></div>
      <!-- Compact ONE-LINE legend (manager style — the old two-row block ate floor space).
           Filled by renderFloor() so it can adapt to this restaurant's features. -->
      <div class="floor-legend" id="floorLegend"></div>
      <!-- Waiter sections (mig 222): "Your tables · 1-6". Stays empty (and takes no
           space) for anyone who isn't restricted to a section. Filled by renderFloor. -->
      <div class="my-section" id="mySection" hidden></div>
      <!-- Skeleton tiles show instantly on open; the first render of #tiles (app.js)
           replaces them with the live floor. Six is enough to fill the first row. -->
      <div class="tiles" id="tiles">
        <div class="skel-tile"><div class="skel-line title"></div><div class="skel-line short"></div><div class="skel-line foot"></div></div>
        <div class="skel-tile"><div class="skel-line title"></div><div class="skel-line short"></div><div class="skel-line foot"></div></div>
        <div class="skel-tile"><div class="skel-line title"></div><div class="skel-line short"></div><div class="skel-line foot"></div></div>
        <div class="skel-tile"><div class="skel-line title"></div><div class="skel-line short"></div><div class="skel-line foot"></div></div>
        <div class="skel-tile"><div class="skel-line title"></div><div class="skel-line short"></div><div class="skel-line foot"></div></div>
        <div class="skel-tile"><div class="skel-line title"></div><div class="skel-line short"></div><div class="skel-line foot"></div></div>
      </div>
    </section>

    <!-- RIGHT: the work panel for the selected table (or the order-taking flow). -->
    <aside class="panel" id="panel">
      <div class="empty">Tap a table to see it — or to take an order for it.</div>
    </aside>
  </main>

  <div id="toasts" class="toasts"></div>
  <!-- The are-you-sure dialog used before sending an order to the kitchen. -->
  <div class="confirm-overlay" id="confirmOverlay" hidden>
    <div class="confirm-box">
      <p id="confirmText"></p>
      <div class="confirm-actions">
        <button class="btn" id="confirmNo">Cancel</button>
        <button class="btn primary" id="confirmYes">Yes, send it</button>
      </div>
    </div>
  </div>
  <script src="/panels/maint.js?v=c4b11ae5"></script>
  <script src="/panels/realtime.js?v=3a9eadca"></script>
  <!-- Offline action queue: saves writes on-device when offline, replays on reconnect. Load BEFORE app.js. -->
  <script src="/panels/outbox.js?v=7b2405a7"></script>
  <!-- Connection light (🟢 Live / 🟡 Reconnecting / 🔴 Offline) + "waiting to sync" list, top-right. AFTER realtime.js + outbox.js. -->
  <script src="/panels/connbadge.js?v=c1df4baa"></script>
  <!-- OFFLINE LAYER: installs public/sw.js so this panel still OPENS and READS with no
       internet, then shows an honest "no internet / showing saved data / needs you" bar.
       offline.js must load AFTER outbox.js (it reads the queue) and after backstack.js
       is available for the back button. -->
  <script src="/panels/swreg.js?v=c82762b3"></script>
  <script src="/panels/offline.js?v=01332551"></script>
  <!-- backstack: the phone's hardware BACK closes the top layer (order mode, drawer) instead of leaving. -->
  <script src="/panels/backstack.js?v=efe8afdb"></script>
  <!-- "who is this bill for?" sheet — phone-first customer capture (shared with the tablet) -->
  <script src="/panels/billcustomer.js?v=1a505d43"></script>
  <!-- errlog: capture screen errors + batched tap breadcrumbs into the Everything Log. -->
  <script src="/panels/errlog.js?v=c845b17b"></script>
  <script src="/panels/issue-raise.js?v=99268ea5"></script>
  <!-- My profile & pay (mig 220) — shared with the manager panel -->
  <script src="/panels/myprofile.js?v=e61d5127"></script>
  <!-- undobar: the shared "take it back" bar after a Serve/Ready/Settle mis-tap. -->
  <script src="/panels/undobar.js?v=26fc85cb"></script>
  <!-- fitnums: big figures shrink their font to FIT their tile instead of clipping. -->
  <script src="/panels/fitnums.js?v=84090f97" data-fit=".ordtotal,.ctotal"></script>
  <!-- billdoc: THE bill and THE kitchen ticket, written down once (LFH_BILLDOC). This panel does
       not print, but it reads the shared money rules from here — discPct(), the one definition of
       "how much percent was taken off" — so the waiter's screen quotes the same figure as the
       manager's bill and the paper. It must load BEFORE app.js, which calls it. -->
  <script src="/panels/billdoc.js?v=d2e0ad7c"></script>
  <script src="app.js?v=13e3ef47"></script>
</body>
</html>
