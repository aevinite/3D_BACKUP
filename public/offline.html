<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Can't open this screen — your work is safe</title>
  <!--
    The last-resort page: shown ONLY when this device has never loaded the page it's
    asking for AND the page couldn't be fetched. Everything here is inline (no fonts, no
    images, no scripts from elsewhere) because by definition nothing can be fetched.
    Tone matters: staff see this mid-service, so it must reassure (nothing was lost)
    and act on its own the moment the connection returns.

    IT MUST NOT GUESS THE REASON. The first version always said "No internet right now",
    which was WRONG the day the app's own database stopped answering: the owner's Wi-Fi was
    fine, the site was up, and this page still blamed his internet — then sat on
    "Waiting for the connection..." forever, because the one thing it probed (/api/health)
    was the very thing that was hanging. That is the same mistake as the "Connection is
    struggling" false alarm: never state a cause the evidence doesn't support. So it now
    TESTS, in order:
      1. is this device on a network at all?        (navigator.onLine)
      2. can we reach our own server?               (a path that touches no database)
      3. is the app behind it actually answering?   (/api/health)
    and says which of the three failed, in plain words. Plus a way OUT of the dead end
    (the home screen), because a screen with one button that changes nothing is a trap.
  -->
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px;
      background: radial-gradient(120% 120% at 50% 0%, #16233f 0%, #0b1020 55%, #070a15 100%);
      color: #e7eefc; font: 500 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
      text-align: center;
    }
    .card {
      width: min(420px, 100%); padding: 30px 24px 26px; border-radius: 20px;
      background: rgba(15, 24, 48, .72); border: 1px solid rgba(148, 163, 184, .22);
      box-shadow: 0 24px 60px rgba(0, 0, 0, .45); backdrop-filter: blur(20px);
    }
    .dot { width: 54px; height: 54px; margin: 0 auto 16px; border-radius: 999px; display: grid; place-items: center;
           background: rgba(239, 68, 68, .16); border: 1px solid rgba(239, 68, 68, .4); }
    .dot span { width: 14px; height: 14px; border-radius: 999px; background: #ef4444; animation: p 1.6s ease-in-out infinite; }
    /* "still checking" and "it's us, not your internet" are amber, not alarm red. */
    .dot.warn { background: rgba(245, 158, 11, .16); border-color: rgba(245, 158, 11, .45); }
    .dot.warn span { background: #f59e0b; }
    @keyframes p { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .45; transform: scale(.82); } }
    h1 { margin: 0 0 8px; font-size: 20px; font-weight: 800; letter-spacing: -.01em; }
    p { margin: 0 0 14px; color: #b8c5de; font-size: 14px; }
    .why { margin: 14px 0 0; padding: 12px 14px; border-radius: 12px; text-align: left;
           background: rgba(56, 189, 248, .09); border: 1px solid rgba(56, 189, 248, .28);
           color: #cfe6f8; font-size: 13px; }
    .why b { color: #7dd3fc; display: block; margin-bottom: 3px; }
    .safe { margin: 14px 0 20px; padding: 12px 14px; border-radius: 12px; text-align: left;
            background: rgba(34, 197, 94, .1); border: 1px solid rgba(34, 197, 94, .3); color: #d6f5e0; font-size: 13px; }
    .safe b { color: #86efac; }
    button {
      width: 100%; padding: 13px 16px; border: 0; border-radius: 12px; cursor: pointer;
      font: 800 15px/1 system-ui, sans-serif; color: #06131f; background: #38bdf8;
    }
    button:active { transform: translateY(1px); }
    button.ghost { margin-top: 10px; background: transparent; color: #cfe0f7;
                   border: 1px solid rgba(148, 163, 184, .38); font-weight: 700; }
    .hint { margin-top: 14px; font-size: 12.5px; color: #8fa1bf; }
    /* The restaurant's own name, when this device has it. Quiet — it identifies the screen,
       it is not the headline. `[hidden]` needs the explicit `display: none` because the rule
       above it sets a display: an author `display` beats the bare `hidden` attribute. */
    .brand { font-size: 12.5px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase;
             color: #7dd3fc; margin: 0 0 10px; }
    .brand[hidden] { display: none; }
    @media (prefers-reduced-motion: reduce) { .dot span { animation: none; } }
  </style>
</head>
<body>
  <main class="card">
    <div class="dot warn" id="dot"><span></span></div>
    <!-- WHOSE SCREEN IS THIS? Empty until we know, and it is NEVER a guess: the name is only
         shown when this device has stored it for the SAME restaurant this path resolves to
         (see brandName() below). A white-label product must not print restaurant A's name on
         restaurant B's screen, and a de-slugged guess ("french-house" -> "French House") can be
         plainly wrong — the real name here is "Little French House". So: the stored name, or
         nothing at all. -->
    <div class="brand" id="brand" hidden></div>
    <h1 id="title">Can't open this screen</h1>
    <p id="sub">This screen hasn't been opened on this device yet, so there's nothing saved to show.</p>
    <div class="why" id="why"><b>Checking what's wrong...</b><span>One moment.</span></div>
    <!-- SAY ONLY WHAT IS ACTUALLY GUARANTEED. This used to claim that EVERYTHING done while
         offline was stored on this device and would send itself — a promise this
         page cannot keep and cannot check. It is untrue in two real cases: a device whose storage
         is refused (private browsing, no room, a locked-down tablet profile), where both queues
         deliberately switch to "keep this open, it is NOT saved"; and the guest actions that have
         no queue at all (joining a table, being approved, the shared cart). The queues themselves
         are careful about this exact distinction — public/panels/outbox.js `unsafeStore`,
         lib/guestOutbox.ts `persisted` — and this page was the one surface still over-promising,
         on the screen that appears when things have gone most wrong. -->
    <div class="safe">
      <b>Anything already saved on this device is safe.</b> It sends itself the moment the
      connection is back — keep this open so it can.
    </div>
    <button type="button" id="retry">Try again</button>
    <button type="button" class="ghost" id="home">Go to the home screen</button>
    <div class="hint" id="hint">Checking the connection...</div>
  </main>
  <script>
    var $ = function (id) { return document.getElementById(id); };

    $("retry").addEventListener("click", function () { location.reload(); });

    // THE WAY OUT HAS TO SUIT WHO IS LOOKING (guest sweep T1, 2026-08-16).
    //
    // This button used to always go to "/", and "/" is the PLATFORM door: app/page.tsx redirects
    // it to /login, the staff username+password screen. For a waiter that is exactly right. For a
    // DINER it is the same dead end components/GuestNotFound.tsx was written to remove — "its only
    // button … pointed at '/', which 307s to /login, the STAFF sign-in … a customer … dumped on a
    // staff password screen". Offline it is worse than useless: "/" is very unlikely to be saved
    // either, so it bounced straight back to this page.
    //
    // The service worker answers the ORIGINAL navigation with this page (event.respondWith does not
    // change the address), so location.pathname here is still the screen the person asked for —
    // which is all we need to tell a diner apart from a member of staff.
    //   /r/<slug>/menu|item…  -> that restaurant's own menu
    //   /menu, /item/…        -> the legacy restaurant-#1 menu (those paths ARE #1, same rule as
    //                            lib/tenantStorage)
    //   /q/<code>             -> the tab's pinned restaurant when we have one (the /q/ page stores
    //                            it before hydration); otherwise leave it as a reload, because the
    //                            printed code is the only thing that knows their table
    //   /view/<folder>        -> the 3D DISH VIEWER, and it was missing from this list until
    //                            2026-08-22 (sweep #7 / T4). It is a guest surface — the product's
    //                            differentiator — reached by "View in 3D" from a dish, and it has
    //                            no /r/<slug> in its path, so it fell through to "/" and dropped a
    //                            DINER on the staff sign-in. Measured, not read: offline on
    //                            /view/<never-opened>, the button said "Go to the home screen" and
    //                            went to "/". A reload of the 3D view with no signal is exactly the
    //                            "tab wakes, reloads" moment this whole layer exists for.
    //                            The tab's pinned restaurant is the best answer and it is already
    //                            there: app/view/[folder]/page.tsx stamps lfh_tab_tenant before
    //                            hydration, from the DATABASE's own slug. Failing that, ?r= carries
    //                            it — validated to [a-z0-9-] here exactly as that page validates it
    //                            — and failing both, a /view with no restaurant resolves to #1
    //                            anyway, so /menu is the consistent answer rather than a guess.
    //   anything else         -> "/" exactly as before, for staff
    var homeHref = "/";
    var homeLabel = "Go to the home screen";
    var restSlug = "";                 // the restaurant this path belongs to, "" for staff / unknown
    var isGuest = false;               // is the person a diner rather than a member of staff?
    (function () {
      var p = location.pathname || "";
      var pinnedSlug = function () {
        var t = "";
        try { t = sessionStorage.getItem("lfh_tab_tenant") || ""; } catch (e) {}
        t = t.toLowerCase();
        return /^[a-z0-9-]+$/.test(t) ? t : "";
      };
      var m = p.match(/^\/r\/([^/]+)\//);
      if (m) { restSlug = m[1].toLowerCase(); isGuest = true; homeHref = "/r/" + restSlug + "/menu"; homeLabel = "Go to the menu"; return; }
      if (/^\/(menu|item)(\/|$)/.test(p)) { isGuest = true; homeHref = "/menu"; homeLabel = "Go to the menu"; return; }
      if (/^\/q\/[^/]+/.test(p)) {
        isGuest = true;
        restSlug = pinnedSlug();
        if (restSlug) { homeHref = "/r/" + restSlug + "/menu"; }
        else { homeHref = p; }          // the printed code is the only thing that knows their table
        homeLabel = "Go to the menu";
        return;
      }
      if (/^\/view\/[^/]+/.test(p)) {
        isGuest = true;
        restSlug = pinnedSlug();
        if (!restSlug) {
          // ?r= is whatever a stranger put in a link, so it is validated the same way
          // app/view/[folder]/page.tsx validates it before trusting it.
          var q = (location.search.match(/[?&]r=([^&]*)/) || [])[1] || "";
          try { q = decodeURIComponent(q); } catch (e) { q = ""; }
          q = q.toLowerCase();
          if (/^[a-z0-9-]+$/.test(q)) restSlug = q;
        }
        homeHref = restSlug ? "/r/" + restSlug + "/menu" : "/menu";
        homeLabel = "Go to the menu";
      }
    })();
    $("home").textContent = homeLabel;
    $("home").addEventListener("click", function () { location.href = homeHref; });

    // ONE BUTTON WHEN THERE IS ONLY ONE ACTION.
    //
    // On /q/<code> with no restaurant pinned in this tab we genuinely cannot send anyone
    // anywhere else — the printed code is the only thing that knows their table, and /menu would
    // be the WRONG restaurant on a multi-restaurant install. So homeHref is the current path, and
    // "Go to the menu" then did exactly what "Try again" does: reload. Two buttons, one action,
    // and the second one implies it goes somewhere. A guest taps it, gets the same screen back,
    // and concludes the app is broken rather than the wifi. (owner said yes, 2026-08-26.)
    //
    // The button stays in the DOM — every guard, and this page's own contract, keys on #home
    // existing — it is simply not shown while it would only repeat the button above it.
    if (homeHref === location.pathname) $("home").hidden = true;

    // THE RESTAURANT'S OWN NAME, when this device has stored it.
    //
    // This is the one screen a guest sees when things have gone wrong, and it was completely
    // anonymous: our wording, our dark card, no clue whose restaurant it belongs to. The name is
    // already on the device — the guest menu stores it (components/AppShell.tsx) — so showing it
    // costs no request and no data at all.
    //
    // NEVER A GUESS, and never the wrong restaurant: it is printed only when the stored record is
    // for the SAME slug this path resolved to. De-slugging was the obvious shortcut and it is
    // wrong — "french-house" would print "French House" for a restaurant actually called
    // "Little French House". Staff screens get nothing; the platform door is not a restaurant.
    (function () {
      if (!isGuest) return;
      var stored = null;
      try { stored = JSON.parse(localStorage.getItem("lfh_brand") || "null"); } catch (e) { stored = null; }
      if (!stored || typeof stored.name !== "string" || !stored.name.trim()) return;
      // "" is the legacy restaurant-#1 scope, which /menu and /item ARE — so an empty slug on
      // both sides is a match, exactly as lib/tenantStorage treats it.
      if (String(stored.slug || "").toLowerCase() !== restSlug) return;
      var el = $("brand");
      el.textContent = stored.name.slice(0, 60);   // textContent: this page can never print markup
      el.hidden = false;
    })();

    // A check that ONLY proves "we reached our own server". It must be a path the service
    // worker leaves alone and that touches NO database: an unmatched /api/ path answers 404
    // from the edge, and a 404 is a perfectly good yes — something answered us.
    // Never use a cached path here: the worker would answer from this device and we would
    // conclude the internet is fine while it is not.
    var REACH = "/api/__offline-check";
    var HEALTH = "/api/health"; // app + database. Never cached (see the NEVER list in sw.js).

    // Every check is time-boxed. Today's fault was a request that never came back at all —
    // with no timeout this page waits for it forever and explains nothing.
    function ping(url, ms) {
      return new Promise(function (resolve) {
        var done = false, ctl = null;
        try { ctl = new AbortController(); } catch (e) { ctl = null; }
        var timer = setTimeout(function () {
          if (done) return; done = true;
          try { if (ctl) ctl.abort(); } catch (e) {}
          resolve({ ok: false, status: 0, timedOut: true });
        }, ms);
        fetch(url + (url.indexOf("?") < 0 ? "?" : "&") + "t=" + Date.now(), {
          method: "GET", cache: "no-store", signal: ctl ? ctl.signal : undefined
        }).then(function (r) {
          if (done) return; done = true; clearTimeout(timer);
          resolve({ ok: !!(r && r.ok), status: (r && r.status) || 0, timedOut: false });
        })["catch"](function () {
          if (done) return; done = true; clearTimeout(timer);
          resolve({ ok: false, status: 0, timedOut: false });
        });
      });
    }

    function say(kind, title, whyTitle, whyText) {
      $("dot").className = "dot" + (kind === "device" ? "" : " warn");
      $("title").textContent = title;
      while ($("why").firstChild) $("why").removeChild($("why").firstChild);
      var b = document.createElement("b"); b.textContent = whyTitle;
      var s = document.createElement("span"); s.textContent = whyText;
      $("why").appendChild(b); $("why").appendChild(s);
      document.title = title + " — your work is safe";
    }

    // WHY it failed, established by testing rather than by assumption.
    function diagnose() {
      if (navigator.onLine === false) {
        say("device", "No internet right now",
          "This device is offline.",
          "It isn't connected to Wi-Fi or mobile data. Reconnect and this screen will open itself.");
        return Promise.resolve(false);
      }
      return ping(REACH, 6000).then(function (reach) {
        // Any answer at all means status > 0. Nothing at all means we never got off this
        // device, or the whole site is unreachable — both are described the same honest way.
        if (!reach.status) {
          say("device", "No internet right now",
            "This device can't reach the internet.",
            "Wi-Fi can say it's connected and still have no internet (a common hotel or cafe network). " +
            "Check the connection — this screen will open itself the moment it's back.");
          return false;
        }
        // We DID reach our server, so the internet is not the problem. Say so plainly.
        return ping(HEALTH, 9000).then(function (health) {
          if (health.ok) return true; // everything is back
          say("app", "The app isn't answering yet",
            "Your internet is fine — this one is on us.",
            health.timedOut
              ? "The app's server was reached but its database isn't responding, so screens that need data can't load yet. It usually comes back on its own, and anything already saved on this device is safe."
              : "The app's server answered with an error (" + (health.status || "no status") +
                "), so screens that need data can't load yet. It usually comes back on its own, and anything already saved on this device is safe.");
          return false;
        });
      });
    }

    // Re-check by hand, automatically when the device says it's back, and on a backing-off
    // timer. navigator.onLine is TRUE on a cafe Wi-Fi with no internet, so reloading just
    // because it says "online" looped this page forever: PROVE there's a real connection
    // first, and back off so a bad network isn't hammered.
    //
    // ONE RETRY LOOP, HOWEVER MANY TIMES THE DEVICE SAYS IT IS BACK.
    // `retryTimer` is not tidiness — it is the whole point. A phone on the edge of coverage fires
    // `online` over and over, and every one of those events that landed while no check happened to
    // be running scheduled ANOTHER timer, with no handle kept anywhere, so nothing could ever
    // cancel it. The chains only died by colliding with each other. Measured with the real page on
    // a local stub (scripts/verify-offline-retry.mjs): ten "back online" events left 47 retry gaps
    // scheduled and produced 59 probes where one loop makes a handful. That is the exact opposite
    // of what the doubling and the jitter below exist for — the page hammered a struggling server
    // HARDER the worse the line flapped, and every device in the restaurant is on this page at the
    // same moment. One handle, cleared before each schedule, keeps it to one loop.
    var wait = 5000, checking = false, retryTimer = null;
    function cycle(fast) {
      if (retryTimer) { clearTimeout(retryTimer); retryTimer = null; }
      // A check already in flight will schedule the next gap itself when it finishes, so there is
      // never a moment with no loop — this only ever collapses duplicates.
      if (checking) return;
      checking = true;
      $("hint").textContent = "Checking the connection...";
      var next = function (back) {
        checking = false;
        if (back) {
          $("hint").textContent = "Back online — reloading...";
          location.reload();
          return;
        }
        if (fast) wait = 5000;
        $("hint").textContent = "Checking again in " + Math.round(wait / 1000) + "s...";
        // ±25% JITTER, like every other retry in the app. The doubling below already bounds the
        // rate, but a bare doubling is still a LOCKSTEP: when the server (not the internet) is
        // what is down, every device in the restaurant lands on this page within a second of the
        // others and then checks in unison at 5s, 10s, 20s… — synchronised waves at exactly the
        // moment the thing needs a quiet gap. Each device now rolls its own delay, so the same
        // number of checks arrive spread out instead of pulsing.
        var jittered = Math.round(wait * (0.75 + Math.random() * 0.5));
        retryTimer = setTimeout(function () {
          retryTimer = null;
          wait = Math.min(wait * 2, 60000);
          cycle(false);
        }, jittered);
      };
      // The catch is not decoration: if a check ever threw, `checking` would stay true and
      // this page would never look again — a screen that recovers from nothing, which is the
      // whole class of bug being fixed here.
      diagnose().then(next)["catch"](function () { next(false); });
    }
    window.addEventListener("online", function () { cycle(true); });
    cycle(true);
  </script>
</body>
</html>
