<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>No such table</title>
<style>
  /* DESIGN 2 — THE ORDER SLIP ON THE SPIKE.
     A kitchen docket flutters down and lands on the spike, and it reads "TABLE 404 — NO SUCH
     TABLE". It sways afterwards like real paper on a rail. The whole screen is the kitchen's own
     language: a docket, a spike, a rubber stamp. Nothing here is a generic error card. */
  :root { color-scheme: light; --paper:#fffdf6; --ink:#23201c; --muted:#8a8175; --stamp:#c0392b; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100dvh; display:grid; place-items:center; padding:26px;
         background:
           repeating-linear-gradient(90deg, rgba(0,0,0,.022) 0 2px, transparent 2px 46px),
           linear-gradient(#3c3733, #2b2724);
         font:500 15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; color:#efe9df; }
  .card { width:min(420px,100%); text-align:center; }

  /* ── the spike + the docket ─────────────────────────────────────────────── */
  .rail { position:relative; height:250px; margin-bottom:8px; }
  .bar  { position:absolute; top:16px; left:6%; right:6%; height:7px; border-radius:4px;
          background:linear-gradient(#d8dae0,#8b8f98); box-shadow:0 2px 5px rgba(0,0,0,.45); }
  .spike{ position:absolute; top:8px; left:50%; translate:-50% 0; width:3px; height:52px;
          background:linear-gradient(#e9ebf0,#9aa0aa); }
  .spike::before { content:""; position:absolute; top:-6px; left:-3px; width:9px; height:9px;
                   border-radius:50%; background:#e9ebf0; }

  .docket { position:absolute; top:26px; left:50%; width:212px; margin-left:-106px;
            background:var(--paper); color:var(--ink); padding:16px 14px 14px; text-align:left;
            box-shadow:0 14px 30px rgba(0,0,0,.42);
            /* a torn bottom edge, drawn not imaged */
            clip-path: polygon(0 0,100% 0,100% calc(100% - 7px),
              94% 100%,88% calc(100% - 6px),82% 100%,76% calc(100% - 6px),70% 100%,64% calc(100% - 6px),
              58% 100%,52% calc(100% - 6px),46% 100%,40% calc(100% - 6px),34% 100%,28% calc(100% - 6px),
              22% 100%,16% calc(100% - 6px),10% 100%,4% calc(100% - 6px),0 100%);
            transform-origin:50% 6px;
            animation: drop 1.15s cubic-bezier(.25,.9,.3,1) .1s both, sway 5.5s ease-in-out 1.4s infinite; }
  .docket .hole { position:absolute; top:6px; left:50%; translate:-50% 0; width:9px; height:9px;
                  border-radius:50%; background:#2b2724; box-shadow:inset 0 1px 2px rgba(0,0,0,.6); }
  .docket h2 { margin:8px 0 2px; font:800 11px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;
               letter-spacing:.18em; color:var(--muted); text-transform:uppercase; }
  .docket .big { font:800 34px/1 ui-monospace,SFMono-Regular,Menlo,monospace; letter-spacing:.02em; margin:2px 0 8px; }
  .docket .row { display:flex; justify-content:space-between; font:600 11.5px/1.6 ui-monospace,Menlo,monospace;
                 color:var(--muted); border-top:1px dashed #ded5c4; padding-top:5px; }
  /* the rubber stamp, slammed on a beat after the docket lands */
  .stamp { position:absolute; right:-6px; bottom:26px; padding:5px 9px; border:2.5px solid var(--stamp);
           color:var(--stamp); font:800 12px/1 system-ui,sans-serif; letter-spacing:.1em; text-transform:uppercase;
           border-radius:4px; transform:rotate(-11deg) scale(2.4); opacity:0;
           animation:slam .32s cubic-bezier(.2,1.4,.4,1) 1.25s forwards; }

  @keyframes drop {
    0%   { transform:translateY(-190px) rotate(-13deg); opacity:0 }
    55%  { opacity:1 }
    70%  { transform:translateY(4px) rotate(4deg) }
    100% { transform:translateY(0) rotate(0deg); opacity:1 }
  }
  @keyframes sway { 0%,100%{ transform:rotate(-1.5deg) } 50%{ transform:rotate(1.5deg) } }
  @keyframes slam { 0%{ opacity:0; transform:rotate(-11deg) scale(2.4) }
                    60%{ opacity:1; transform:rotate(-11deg) scale(.94) }
                    100%{ opacity:1; transform:rotate(-11deg) scale(1) } }

  #brand { font:800 11px/1 system-ui,sans-serif; letter-spacing:.18em; text-transform:uppercase;
           color:#b9ad9a; margin-bottom:10px; }
  #brand[hidden] { display:none; }
  h1 { font-size:21px; margin:14px 0 8px; font-weight:800; }
  #why { color:#b3aa9d; font-size:14px; margin:0 auto 24px; max-width:33ch; }
  .acts { display:flex; flex-direction:column; gap:10px; }
  a,button { font:700 14.5px/1 system-ui,sans-serif; border-radius:10px; padding:14px 18px;
             cursor:pointer; text-decoration:none; border:0; }
  #home { background:var(--paper); color:var(--ink); }
  #retry{ background:transparent; color:#d9d1c5; border:1px solid rgba(255,255,255,.22); }

  @media (prefers-reduced-motion: reduce) {
    .docket { animation:none; }
    .stamp  { animation:none; opacity:1; transform:rotate(-11deg) scale(1); }
  }
</style>
</head>
<body>
  <main class="card">
    <div id="brand" hidden></div>
    <div class="rail">
      <div class="bar"></div><div class="spike"></div>
      <div class="docket">
        <div class="hole"></div>
        <h2>Table</h2>
        <div class="big">404</div>
        <div class="row"><span>Covers</span><span>&mdash;</span></div>
        <div class="row"><span>Order</span><span>none</span></div>
        <div class="row"><span>Status</span><span>no such table</span></div>
        <div class="stamp">Void</div>
      </div>
    </div>
    <h1 id="title">That table doesn&rsquo;t exist</h1>
    <p id="why">The page you asked for isn&rsquo;t here. If you&rsquo;re sitting down, scan the QR code on
       your table again &mdash; or ask a member of staff.</p>
    <div class="acts">
      <a id="home" href="/">Go to the menu</a>
      <button id="retry" type="button" onclick="location.reload()">Try again</button>
    </div>
    <div id="hint" style="margin-top:14px;font-size:12.5px;color:#8a8175"></div>
  </main>
<script>
  (function(){ try {
    var b = JSON.parse(localStorage.getItem("lfh_brand") || "null");
    if (b && b.name) { var el = document.getElementById("brand"); el.textContent = b.name; el.hidden = false; }
  } catch (e) {} })();
</script>
</body>
</html>
