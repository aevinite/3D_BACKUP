<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>He dropped it</title>
<style>
  /* DESIGN 3 — THE WAITER WHO LOST THE TRAY.
     A little waiter walks in from the left, trips, and the three plates leave his tray and settle
     into 4 - 0 - 4. Then he shrugs, once. It is the only one of the five with a character in it,
     which makes it the warmest and also the riskiest: a character has to be charming at 390px or
     it is just clutter. Drawn entirely in SVG so it stays sharp at any size. */
  :root { color-scheme:light; --ink:#20242c; --muted:#6f7784; --accent:#e07a3f; --bg:#fbf7f2; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100dvh; display:grid; place-items:center; padding:26px;
         background:radial-gradient(130% 100% at 50% 0%, #fff 0%, var(--bg) 55%, #f0e7dc 100%);
         color:var(--ink); font:500 15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif; text-align:center; }
  .card { width:min(440px,100%); }
  .stage { width:100%; height:200px; position:relative; }
  svg { width:100%; height:100%; overflow:visible; display:block; }

  /* the whole figure walks in, then jolts on the trip */
  .guy { animation: walkIn 1.25s cubic-bezier(.3,.8,.4,1) .1s both, trip .5s ease-in-out 1.3s both; }
  /* the legs alternate while he is walking, then stop */
  .leg-a { transform-origin:50px 74px; animation: step .42s ease-in-out .1s 3 alternate; }
  .leg-b { transform-origin:50px 74px; animation: step .42s ease-in-out .31s 3 alternate-reverse; }
  .tray  { transform-origin:74px 44px; animation: trayTilt .55s ease-in 1.3s both; }
  .arm   { transform-origin:56px 46px; animation: armUp .4s ease-out 1.75s both; }

  /* the three plates fly off and become the number */
  .p { opacity:0; }
  .p1 { animation: fly1 .95s cubic-bezier(.25,.8,.3,1) 1.42s forwards; }
  .p2 { animation: fly2 .95s cubic-bezier(.25,.8,.3,1) 1.50s forwards; }
  .p3 { animation: fly3 .95s cubic-bezier(.25,.8,.3,1) 1.58s forwards; }
  /* the digits fade in inside/next to the plates once they have settled */
  .d { opacity:0; animation: digitIn .45s ease-out 2.35s forwards; }
  .d2 { animation-delay:2.45s }
  .d3 { animation-delay:2.55s }
  /* a small puff of dust where he stumbles */
  .dust { opacity:0; animation: dust .7s ease-out 1.34s forwards; }

  @keyframes walkIn { from { transform:translateX(-130px) } to { transform:translateX(0) } }
  @keyframes step   { from { transform:rotate(-15deg) } to { transform:rotate(15deg) } }
  @keyframes trip   { 0%{ transform:none } 35%{ transform:translateY(5px) rotate(-9deg) }
                      70%{ transform:translateY(2px) rotate(3deg) } 100%{ transform:rotate(-2deg) } }
  @keyframes trayTilt{ to { transform:rotate(38deg) translate(4px,10px) } }
  @keyframes armUp  { to { transform:rotate(-26deg) } }
  @keyframes dust   { 0%{ opacity:.5; transform:scale(.5) } 100%{ opacity:0; transform:scale(1.9) translateY(-8px) } }
  @keyframes digitIn{ from { opacity:0; transform:translateY(6px) } to { opacity:1; transform:none } }
  /* each plate arcs to its own resting spot, spinning as it goes */
  /* The plates THROW — up, over, and out of frame. They do not try to land on a digit: the
     landed set below is one group containing both the plate and its number, so those two are
     positioned by a single sum and cannot drift apart. Chasing three separate landing coordinates
     across a scaled viewBox is what made the first two attempts miss. */
  @keyframes fly1 { 0%{ opacity:1; transform:translate(0,0) rotate(0) }
                    40%{ opacity:1; transform:translate(-16px,-30px) rotate(-200deg) }
                    100%{ opacity:0; transform:translate(-34px,54px) rotate(-520deg) } }
  @keyframes fly2 { 0%{ opacity:1; transform:translate(0,0) rotate(0) }
                    40%{ opacity:1; transform:translate(10px,-36px) rotate(220deg) }
                    100%{ opacity:0; transform:translate(24px,58px) rotate(560deg) } }
  @keyframes fly3 { 0%{ opacity:1; transform:translate(0,0) rotate(0) }
                    40%{ opacity:1; transform:translate(34px,-28px) rotate(-180deg) }
                    100%{ opacity:0; transform:translate(72px,52px) rotate(-480deg) } }
  /* the landed set: plate + number together, one per digit */
  .set { opacity:0; animation:setIn .5s cubic-bezier(.2,1.2,.4,1) forwards }
  .set1 { animation-delay:2.05s } .set2 { animation-delay:2.2s } .set3 { animation-delay:2.35s }
  @keyframes setIn { from { opacity:0; transform:translateY(-14px) scale(.9) } to { opacity:1; transform:none } }

  #brand { font:800 11.5px/1 system-ui,sans-serif; letter-spacing:.16em; text-transform:uppercase;
           color:var(--accent); margin-bottom:10px; }
  #brand[hidden]{ display:none }
  h1 { font-size:22px; margin:2px 0 8px; font-weight:800; letter-spacing:-.01em; }
  #why { color:var(--muted); font-size:14.5px; margin:0 auto 24px; max-width:33ch; }
  .acts { display:flex; flex-direction:column; gap:10px; }
  a,button { font:700 14.5px/1 system-ui,sans-serif; border-radius:12px; padding:14px 18px;
             cursor:pointer; text-decoration:none; border:0; }
  #home { background:var(--ink); color:#fff; }
  #retry{ background:transparent; color:var(--ink); border:1px solid rgba(32,36,44,.2); }

  @media (prefers-reduced-motion: reduce) {
    .guy,.leg-a,.leg-b,.tray,.arm,.dust { animation:none }
    .tray { transform:rotate(38deg) translate(4px,10px) }
    .arm  { transform:rotate(-26deg) }
    .p { animation:none; opacity:0 }
    .set { animation:none; opacity:1 }
  }
</style>
</head>
<body>
  <main class="card">
    <div id="brand" hidden></div>
    <div class="stage">
      <svg viewBox="0 0 260 190" role="img" aria-label="A waiter trips and three plates land as four zero four">
        <!-- floor line -->
        <line x1="8" y1="178" x2="252" y2="178" stroke="rgba(32,36,44,.22)" stroke-width="2.5" stroke-linecap="round"/>
        <g class="guy" transform="translate(28,86)">
          <!-- legs -->
          <g class="leg-b"><rect x="46" y="66" width="7" height="26" rx="3.5" fill="#3a4250"/></g>
          <g class="leg-a"><rect x="52" y="66" width="7" height="26" rx="3.5" fill="#2b3240"/></g>
          <!-- apron + body -->
          <path d="M40 30 h26 a6 6 0 0 1 6 6 v30 a4 4 0 0 1-4 4 H38 a4 4 0 0 1-4-4 V36 a6 6 0 0 1 6-6z" fill="#2b3240"/>
          <path d="M40 46 h26 v22 a3 3 0 0 1-3 3 H43 a3 3 0 0 1-3-3z" fill="#f4efe7"/>
          <!-- head -->
          <circle cx="53" cy="18" r="12" fill="#f0c9a4"/>
          <path d="M41 15 a12 12 0 0 1 24 0 z" fill="#3a2c22"/>
          <!-- the arm holding the tray -->
          <g class="arm"><rect x="56" y="40" width="22" height="6" rx="3" fill="#f0c9a4"/></g>
          <!-- the tray tips FORWARD and down, the way it would if he stumbled -->
          <g class="tray">
            <ellipse cx="86" cy="40" rx="24" ry="6" fill="#b9bfc9"/>
            <ellipse cx="86" cy="38" rx="24" ry="6" fill="#d7dce3"/>
          </g>
          <!-- the three plates: outside the tray group on purpose, so "land here" means here -->
          <g class="p p1"><ellipse cx="74" cy="33" rx="14" ry="4.6" fill="#fff" stroke="#dfd6c8" stroke-width="1.2"/></g>
          <g class="p p2"><ellipse cx="86" cy="31" rx="14" ry="4.6" fill="#fff" stroke="#dfd6c8" stroke-width="1.2"/></g>
          <g class="p p3"><ellipse cx="98" cy="33" rx="14" ry="4.6" fill="#fff" stroke="#dfd6c8" stroke-width="1.2"/></g>
          <!-- dust at the stumble -->
          <g class="dust"><circle cx="50" cy="90" r="9" fill="rgba(120,110,95,.35)"/></g>
          <!-- and a shadow, so he is standing ON the floor rather than floating above it -->
          <ellipse cx="52" cy="92" rx="22" ry="4" fill="rgba(32,36,44,.16)"/>
        </g>
        <!-- THE LANDED SET. Each group holds a plate AND its number, so the two are placed by one
             transform and can never be out of line with each other. -->
        <g font-family="system-ui,sans-serif" font-weight="800" font-size="34" text-anchor="middle" fill="#20242c">
          <g transform="translate(64,0)"><g class="set set1">
            <ellipse cx="0" cy="150" rx="27" ry="7.8" fill="#fff" stroke="#ded5c6" stroke-width="1.6"/>
            <ellipse cx="0" cy="149" rx="13" ry="3.6" fill="#f4f0e8"/>
            <text x="0" y="140">4</text>
          </g></g>
          <g transform="translate(130,0)"><g class="set set2">
            <ellipse cx="0" cy="150" rx="27" ry="7.8" fill="#fff" stroke="#ded5c6" stroke-width="1.6"/>
            <ellipse cx="0" cy="149" rx="13" ry="3.6" fill="#f4f0e8"/>
            <text x="0" y="140">0</text>
          </g></g>
          <g transform="translate(196,0)"><g class="set set3">
            <ellipse cx="0" cy="150" rx="27" ry="7.8" fill="#fff" stroke="#ded5c6" stroke-width="1.6"/>
            <ellipse cx="0" cy="149" rx="13" ry="3.6" fill="#f4f0e8"/>
            <text x="0" y="140">4</text>
          </g></g>
        </g>
      </svg>
    </div>
    <h1 id="title">He dropped that one</h1>
    <p id="why">The page you asked for isn&rsquo;t here. If you&rsquo;re at a table, scan the QR code again
       &mdash; or ask a member of staff.</p>
    <div class="acts">
      <a id="home" href="/">Go to the menu</a>
      <button id="retry" type="button" onclick="location.reload()">Try again</button>
    </div>
    <div id="hint" style="margin-top:14px;font-size:12.5px;color:var(--muted)"></div>
  </main>
<script>
  (function(){ try {
    var b = JSON.parse(localStorage.getItem("lfh_brand") || "null");
    if (b && b.name) { var el = document.getElementById("brand"); el.textContent = b.name; el.hidden = false; }
  } catch (e) {} })();
</script>
</body>
</html>
