# The checks that used to run on exactly one laptop.
#
# WHY THIS EXISTS. CLAUDE.md says of four guards that they run "AUTOMATICALLY as a PostToolUse
# hook" and, of one of them, "NOW ENFORCED, not just asked for". The only thing wiring them to an
# edit was `.claude/settings.json`, and that file was gitignored — so a fresh clone, a CI run, and
# every one of the 28 git worktrees had zero guards, silently. Nothing printed a warning; an
# unguarded session looked exactly like a guarded one. That file is versioned now, and this is the
# other half: the same checks, on every push, where nobody has to remember.
#
# It is deliberately CHEAP and SECRET-FREE. Every step below reads only files in the repo — no
# database, no login, no deployed site, no `.env.local`. That is why it can run on a pull request
# from anywhere and why it takes well under a minute. The heavy suites (`verify:everything`,
# `load:ramp`, anything with `--base`) are NOT here on purpose: they write to the shared database,
# and two of them at once is what took it down on 2026-07-31.
name: checks

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

# A newer push supersedes an in-flight run on the same branch. Parallel sessions push often here.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # verify:ui and verify:test-safety compare against origin/main to judge only what is
          # NEW (duplicate migration numbers, a migration missing its REVOKE). With a shallow
          # clone that comparison silently finds nothing and both checks become weaker in a way
          # that still prints green — the exact failure mode this whole file exists to stop.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci --no-audit --no-fund

      # tsc --noEmit. CLAUDE.md's definition of done asks for a type-check and, until now, no
      # command provided one: `npm run lint` is bare eslint and does not type-check.
      - name: typecheck
        run: npm run -s typecheck

      - name: lint
        run: npm run -s lint

      # money rounding, error classification, and the brandText/brandTheme/starterMenu units.
      # Not the e2e (test:totals) — that one reads the real database.
      - name: unit tests
        run: npm run -s test:money && npm run -s test:errors && npm run -s test:units

      # The static, read-only guards. Each one is a bug that actually reached someone's screen.
      #
      # It was 16. Nine more green, cheap, static-looking guards were sitting outside it, run by
      # nobody but a person remembering to — the same shape of silence this whole file exists to end
      # (see the header). SIX of them moved in. Two did NOT, and the reason is worth writing down
      # because the first attempt at this put them in and CI caught it within a minute:
      #
      #   · verify:avlive-release (verify-avlive-offline-complete.mjs) reads the CLIENT stack folder
      #     ~/Documents/LIVE_PROJECTS/3D_Menu_Av to confirm a surgical patch landed. That folder does
      #     not exist on a runner, so it reported all 24 files "MISSING on the client stack" and
      #     failed. It is a POST-RELEASE check on one Mac, not a repo guard. It must never run here —
      #     nothing in CI should reach for AV live.
      #   · verify:no-ask reads the owner's ~/.claude/CLAUDE.md, where the standing delete order
      #     lives. With no home config it exits 2, so it would fail every run. It guards this
      #     machine's configuration, and the local PostToolUse hook is the right and only place
      #     for it.
      #
      # The test for "does this belong in CI" is therefore not "is it fast and green here" — it is
      # "does it read anything outside the repo".
      # It RUNS ALL OF THEM and reports every failure (scripts/verify-static.mjs). It used to be a
      # single `&&` chain in package.json, and a chain stops at its first non-zero exit — so one stale
      # guard switched off every guard behind it, twice in two days: verify-owner-reports muted SEVEN
      # (main red for 15 runs) and verify-merge-party muted TEN (main red for five hours). Both times
      # the product was fine and the guard was asserting the spelling of code that had legitimately
      # changed shape. The false alarm was not the damage; the muted checks were.
      - name: static guards
        run: npm run -s verify:static

      # Separate because its npm alias bundles lib/accessTree.ts + lib/staffCaps.ts with esbuild
      # first — running scripts/verify-access-model.mjs bare reads whatever stale bundle is in
      # node_modules/.cache and reports on code that is no longer there.
      - name: access model
        run: npm run -s verify:access
