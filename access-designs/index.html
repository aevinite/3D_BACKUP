<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Access &amp; permissions — 5 design directions</title>
<link rel="stylesheet" href="styles/app.css">
<link rel="stylesheet" href="styles/layouts.css">
</head>
<body>

<header id="switcher" role="banner"></header>
<main class="page" id="page"></main>

<!-- shared, layout-agnostic overlays -->
<div id="infopop" role="dialog" aria-label="What this permission does"></div>
<div id="scrim"></div>
<aside id="drawer" role="dialog" aria-label="Permission detail">
  <div class="dhead"></div>
  <div class="dbody"></div>
</aside>
<div id="lightbox" role="dialog" aria-label="Screenshot">
  <button class="close" aria-label="Close">
    <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6L6 18" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" fill="none"/><path d="M6 6l12 12" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" fill="none"/></svg>
  </button>
  <div class="inner"></div>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
